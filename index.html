<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            flex-direction: column;
            background: rgb(16, 16, 16);
            padding: 0 20%;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .message {
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            text-align: center;
            flex-direction: column;
            position: relative;
        }
        .message p {
            margin-top: 5rem;
            opacity: .5;
        }
        .arrows {
            font-size: 5rem;
            opacity: .5;
            animation: UpDown 1s linear infinite;
            position: absolute;
        }
        @keyframes UpDown {
            0% {
                bottom: 0;
            }
            50% {
                bottom: .2em;
            }
            100% {
                bottom: 0;
            }
        }
        .contact {
            display: flex;
            justify-content: center;
            text-align: center;
            margin: 2rem;
        }
        .contact-link {
            font-size: 3rem;
        }
    </style>
    <title>Joaquin Ogallar</title>
</head>
<body>
    <div class="message">
        <h1>If you're reading this, I'm currently working on this page.</h1>
        <p>But I can give you a hint of my progress so far.</p>
        <span class="arrows">↓</span>
    </div>
    <img src="./img1.png" alt="" />
    <img src="./img2.png" alt="" />
    <div class="contact">
        <span class="contact-link"><a href="https://www.linkedin.com/in/joaquin-ogallar-a90b2424b/" target="_blank">Contact me here! </a></span>
    </div>
</body>
</html>
